name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      library: ${{ steps.filter.outputs.library }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Detect changed surfaces
        id: filter
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            library:
              - 'packages/discord-ts-selfbot/**'
              - 'packages/test-harness/**'
              - 'apps/examples-js/**'
              - 'apps/examples-ts/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'scripts/**'
            docs:
              - 'apps/docs/**'
              - 'packages/discord-ts-selfbot/**'
              - 'packages/test-harness/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'

  ci:
    name: Checks
    needs: changes
    if: |
      github.event.pull_request.draft != true &&
      (needs.changes.outputs.library == 'true' || needs.changes.outputs.docs == 'true')
    uses: ./.github/workflows/_ci-reusable.yml
    with:
      run_check: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.docs == 'true' }}
      run_lint: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.docs == 'true' }}
      run_test: ${{ needs.changes.outputs.library == 'true' }}
      run_docs: ${{ needs.changes.outputs.library == 'true' || needs.changes.outputs.docs == 'true' }}
