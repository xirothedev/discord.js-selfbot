name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/_ci-reusable.yml
    with:
      run_check: true
      run_lint: true
      run_test: true
      run_docs: true

  release:
    name: Version or Publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          TURBO_UI: '0'
        run: bun run build

      - name: Smoke Node entries (release gate, ADR 0013)
        run: bun run --cwd packages/discord-ts-selfbot test:node

      - name: Determine release mode
        id: mode
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
          # A version PR consumes its changesets. Detect the merge from that
          # deletion rather than the commit message, which is editable.
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
             git diff --name-only --diff-filter=D HEAD^ HEAD -- '.changeset/*.md' | grep -q .; then
            echo "version_pr_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_pr_merged=false" >> "$GITHUB_OUTPUT"
          fi

      # Publishing is gated: a plain push to main may only open/update the
      # version PR. Packages are published when that PR is merged (or when the
      # workflow is dispatched manually).
      - name: Create Release Pull Request or Publish
        id: changesets
        if: >-
          steps.mode.outputs.has_changesets == 'true' || steps.mode.outputs.version_pr_merged == 'true' || github.event_name == 'workflow_dispatch'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run changeset:version
          publish-script: bun run changeset:publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
