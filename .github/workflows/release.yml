name: Release

on:
  push:
    tags:
      - '14*' # Trigger on version 14.x.x tags

permissions:
  contents: read
  # Bun 1.4.4 rejects --provenance (npm provenance is not supported yet),
  # so id-token: write stays off until Bun can generate it.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Publish to NPM
        working-directory: packages/discord-ts-selfbot
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
