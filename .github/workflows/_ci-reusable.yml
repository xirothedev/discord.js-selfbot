name: CI (reusable)

on:
  workflow_call:
    inputs:
      run_check:
        description: Run type check
        type: boolean
        default: true
      run_lint:
        description: Run lint, format check, and boundary check
        type: boolean
        default: true
      run_test:
        description: Run tests
        type: boolean
        default: true
      run_docs:
        description: Build docs
        type: boolean
        default: true

# Reusable callee: keep its own group distinct from callers (rules/github-actions.md #3).
concurrency:
  group: ci-reusable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check
    if: ${{ inputs.run_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        env:
          TURBO_UI: '0'
        run: bun run check

  lint:
    name: Lint
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        env:
          TURBO_UI: '0'
        run: bun run fmt:check

      - name: Lint
        env:
          TURBO_UI: '0'
        run: bun run lint

      - name: Boundaries
        env:
          TURBO_UI: '0'
        run: bun run lint:boundaries

      - name: Docs snippets
        env:
          TURBO_UI: '0'
        run: bun run docs:snippets

  test:
    name: Tests
    if: ${{ inputs.run_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        env:
          TURBO_UI: '0'
        run: bunx turbo run test -- --parallel=2 --max-concurrency=4

  build-docs:
    name: Build docs
    if: ${{ inputs.run_docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        env:
          TURBO_UI: '0'
        run: bun run docs
